# Paper desk — no live orders. Ever.
default_equity_usdt = 10000.0
risk_pct = 0.5
min_rr = 2.0
session_min_score = 3
max_consecutive_losses = 5
one_position_per_asset = true

# Perpetuals, not spot. Different order book, different price series, and the
# only product where these fees leave an edge intact. Contract size, lot and
# tick come from OKX itself — see ict/instruments.py.
instruments = ["BTC-USDT-SWAP", "ETH-USDT-SWAP"]

# Apply min_rr to the reward-to-risk AFTER fees. Off for now: turning it on
# changes which setups fire, so flip it once the backtest says what it costs
# (`python -m backtest sweep` prints exactly that).
min_rr_on_net = false
fabio_min_rr = 1.5

# The stop decides the leverage: leverage = risk_pct / stop_pct. At 0.5% risk a
# 1% stop is 0.5x and a 0.04% stop is 12.5x — the 365d backtest found ICT taking
# $131,090 of ETH on a $10,000 account off a 0.04% stop. Nothing in either
# strategy bounds the stop, so the desk bounds the consequence. A starting
# value, not a truth: run the sweep and set it from what it costs.
max_leverage = 5.0

# The loss breaker is a cooldown, not a ban. It used to clear only on a win,
# and a halted strategy can never win: in the 365d replay Fabio took 5 losses
# on BTC and was blocked for the remaining 33,721 bars. After this many hours
# one trade is let through; if it loses, the clock restarts.
loss_cooldown_hours = 24

# OKX 15m FVG is the entry timeframe. HTF is NY daily + weekly.
entry_bar = "15m"
htf_bar = "1H"
htf_limit = 240
entry_limit = 96

# Dead zone is a hard veto. Windows live in ict/sessions.py in LOCAL market
# hours, so they follow DST instead of drifting an hour for half the year.
# ICT killzones: Asia 09-17 Tokyo (3) | London 07-11 local (4) | NY 08-11 ET (5)
# Fabio runs the full cash session (NY 08-16 ET) — it needs the whole profile.
# The watch loop sits the public WS; this value is only for --loop.
loop_minutes = 10

# Your OKX rates, Lv1 Regular, perp USDT (GET /account/trade-fee), in percent
# per execution, charged on notional. The desk enters and exits at market, so
# taker applies on both sides. Keep this table last: everything after a TOML
# table header belongs to it.
[fees]
taker_pct = 0.05
maker_pct = 0.02
