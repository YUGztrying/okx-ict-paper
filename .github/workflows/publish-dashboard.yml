name: publish-dashboard

# The blotter, kept current.
#
# The journal is pushed every scan, but paper.yml only reaches its Pages steps
# when its job ends — a 5h20 watch. The phone would show a position that closed
# hours ago, live-marked against OKX, which is worse than showing nothing.
#
# This rebuilds desk.json from the journal already on main and publishes it.
# It reads and deploys; it never commits, so it cannot race the desk's push.
#
# The desk dispatches this after each scan (ict/cloud.py publish_dashboard).
# A GITHUB_TOKEN push does not retrigger `on: push`, so dispatch — the same
# mechanism that chains the watch — is what works. The cron is only a backup:
# GitHub skips cron hours on public repos, which is fine for a redraw.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - "dashboard/index.html"
      - "ict/journal.py"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Runs queued behind the in-flight one collapse to
# the newest, which is what a redraw wants; the in-flight one is left alone.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build desk.json from the journal
        run: python -c "from ict.journal import write_desk; print(write_desk())"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
