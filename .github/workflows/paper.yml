name: paper-scan

# One writer. Public WS last for SL/TP; business WS candle confirm=1 for entries.
# ~5h20 watch (GitHub max 6h). Python persists the journal THEN chains.
# YAML persist + dispatch is the safety net if the process dies first.
# 6h cron is only a dead-man. GITHUB_TOKEN may fire workflow_dispatch.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Pages moved to publish-dashboard.yml; this job only writes the journal
# and dispatches (the chain, and the blotter redraw).
permissions:
  contents: write
  actions: write

concurrency:
  group: paper-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Git identity for live journal pushes
        run: |
          git config user.name "okx-ict-paper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Watch the desk
        env:
          PAPER_GIT_PUSH: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python paper.py --watch --minutes 320 --chain-after 318

      - name: Persist journal
        if: always()
        env:
          PAPER_GIT_PUSH: "1"
        run: python -c "from ict.cloud import persist_journal; persist_journal('paper scan')"

      # publish-dashboard.yml owns Pages: it redraws the blotter every scan
      # instead of only when this 5h20 job ends. Two workflows deploying Pages
      # would just race each other, so this one no longer does.
      - name: Publish dashboard
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -c "from ict.cloud import publish_dashboard; publish_dashboard()"

      - name: Chain next watch
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -c "from ict.cloud import dispatch_next; dispatch_next()"

