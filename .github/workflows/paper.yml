name: paper-scan

# One writer. Public WS last for SL/TP; candle confirm=1 for entries.
# ~5h20 watch (GitHub max 6h). Python persists the journal THEN chains.
# YAML persist + dispatch is the safety net if the process dies first.
# 6h cron is only a dead-man. GITHUB_TOKEN may fire workflow_dispatch.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: paper-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Git identity for live journal pushes
        run: |
          git config user.name "okx-ict-paper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Watch the desk
        env:
          PAPER_GIT_PUSH: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python paper.py --watch --minutes 320 --chain-after 318

      - name: Persist journal
        if: always()
        env:
          PAPER_GIT_PUSH: "1"
        run: python -c "from ict.cloud import persist_journal; persist_journal('paper scan')"

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: dashboard

      - name: Chain next watch
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -c "from ict.cloud import dispatch_next; dispatch_next()"

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
