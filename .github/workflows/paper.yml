name: paper-scan

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Scan once
        run: python paper.py

      - name: Persist journal
        run: |
          git config user.name "okx-ict-paper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal dashboard/desk.json
          git diff --staged --quiet || git commit -m "paper scan"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
