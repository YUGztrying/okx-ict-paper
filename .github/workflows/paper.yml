name: paper-scan

# GitHub's */10 cron skips hours on public repos. Entries need a closed 15m bar;
# exits need ticks. Watch ~8 min, then this job dispatches itself (GITHUB_TOKEN
# may fire workflow_dispatch). Hourly cron is only a dead-man restart.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: paper-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Watch 15m closes and open SL/TP
        continue-on-error: true
        run: python paper.py --watch --minutes 8

      - name: Persist journal
        if: always()
        run: |
          git config user.name "okx-ict-paper"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal dashboard/desk.json
          git diff --staged --quiet || git commit -m "paper scan"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: dashboard

      - name: Chain next watch
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run paper.yml --ref main

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
